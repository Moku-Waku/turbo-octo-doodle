<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>列表页</title>
    <!-- 标签栏图标 -->
    <link rel="icon" href="../icon/reisa.ico" type="image/x-icon" />
    <link href="../tailwind_package/src/output.css" rel="stylesheet" />
  </head>

  <body>
    <!-- ==================== 导航栏 ==================== -->
    <div
      class="w-full max-w-full h-16 rounded-b-lg bg-[#dbe8f644] font-japan-cute flex items-center relative"
    >
      <!-- 侧边栏开关 -->
      <button
        id="sidebar-btn"
        type="button"
        aria-label="打开侧边栏"
        class="group absolute left-4 top-1/2 -translate-y-1/2 w-8 h-8"
      >
        <img
          src="../icon/可拖拽.png"
          alt="侧边栏"
          class="absolute inset-0 w-8 h-8 object-contain transition-opacity duration-200 group-hover:opacity-0"
        />
        <img
          src="../icon/可拖拽_选中.png"
          alt=""
          class="absolute inset-0 w-8 h-8 object-contain opacity-0 transition-opacity duration-200 group-hover:opacity-100"
        />
      </button>

      <!-- 主导航 -->
      <ul class="flex w-full gap-6 list-none justify-center text-3xl">
        <li>
          <a
            href="../index.html"
            class="text-white hover:text-blue-300 transition"
            rel="noopener"
            >开始</a
          >
        </li>
        <li>
          <a
            href="songlist.html"
            class="text-white hover:text-blue-300 transition"
            rel="noopener"
            >发现</a
          >
        </li>
        <li>
          <a href="#" class="text-white hover:text-blue-300 transition"
            >我的喜欢</a
          >
        </li>
      </ul>

      <!-- 导航栏右侧用户信息 -->
      <div
        class="absolute right-4 top-1/2 -translate-y-1/2 hidden md:flex items-center gap-3"
      >
        <img
          src="../img/head.jpg"
          class="rounded-full w-12 h-12 object-cover shrink-0"
          style="width: 48px; height: 48px"
          alt="用户头像"
        />
        <p id="username" class="text-white">冴月麟</p>
      </div>
    </div>

    <!-- ==================== 侧边栏 ==================== -->
    <aside
      id="sidebar"
      class="fixed top-0 left-0 h-full w-64 overflow-hidden bg-[#dbe8f644] flex flex-col backdrop-blur-md border-r border-white/20 z-40 -translate-x-full transition-transform duration-300"
    >
      <!-- 侧边栏头部：头像 + 用户名 + 关闭 -->
      <div
        class="h-16 flex items-center justify-center text-white text-2xl font-japan-cute border-b border-white/20 relative"
      >
        <div class="flex items-center justify-between gap-1">
          <img
            src="../img/head.jpg"
            class="rounded-full w-12 h-12 object-cover shrink-0"
            style="width: 48px; height: 48px"
            alt="用户头像"
          />
          <p id="username">冴月麟</p>
        </div>

        <button
          id="sidebar-close"
          type="button"
          aria-label="关闭侧边栏"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-white text-xl leading-none hover:text-blue-300 transition"
        >
          ✕
        </button>
      </div>

      <!-- 垂直菜单 -->
      <nav class="flex-1 flex flex-col gap-2 p-4 text-white">
        <a
          href="../index.html"
          class="px-4 py-3 rounded-lg bg-white/20 font-bold hover:bg-white/30 transition"
          rel="noopener"
          >开始</a
        >
        <a
          href="songlist.html"
          class="px-4 py-3 rounded-lg hover:bg-white/20 transition"
          rel="noopener"
          >发现</a
        >
        <a href="#" class="px-4 py-3 rounded-lg hover:bg-white/20 transition"
          >我的喜欢</a
        >
      </nav>
    </aside>

    <!-- 遮罩：点一下关闭侧边栏 -->
    <div id="sidebar-mask" class="fixed inset-0 bg-black/40 z-30 hidden"></div>

    <!-- ==================== 主体（内容待补充） ==================== -->
    <div class="w-full flex">
      <div></div>
      <hr
        class="h-px border-0 bg-linear-to-r from-transparent via-white/50 to-transparent my-2"
      />
      <ul class="">
        <li></li>
      </ul>
    </div>

    <!-- ==================== 脚本 ==================== -->
    <script src="../js/jquery-4.0.0.min.js"></script>
    <script src="../js/layout.js"></script>
  </body>
</html>
