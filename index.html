<!doctype html>
<html lang="en" class="scroll-smooth scrollbar-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音乐播放页</title>
    <!-- 标签栏图标 -->
    <link rel="icon" href="./icon/reisa.ico" type="image/x-icon" />
    <link href="./tailwind_package/src/output.css" rel="stylesheet" />
  </head>

  <body>
    <!-- ==================== 背景图 ==================== -->
    <div
      class="fixed inset-0 -z-10 bg-cover bg-center bg-no-repeat blur-[2px]"
      style="background-image: url(img/Touhou-.webp)"
    ></div>
    <!-- 深色遮罩：压暗背景，保证卡片和文字有对比度 -->
    <div class="fixed inset-0 -z-10 bg-[#0f1a24]/45"></div>

    <!-- ==================== 常驻侧边栏 ==================== -->
    <aside
      id="sidebar"
      class="hidden md:flex fixed top-0 left-0 h-screen w-52 flex-col bg-[#0f1a24]/35 backdrop-blur-xl border-r border-white/10 z-40"
    >
      <!-- 品牌 -->
      <div
        class="h-16 flex items-center gap-2 px-4 border-b border-white/10 shrink-0"
      >
        <img
          src="icon/play.png"
          alt=""
          class="w-6 h-6 object-contain opacity-90"
        />
        <span class="text-white font-japan-cute text-lg">音乐播放器</span>
      </div>

      <!-- 菜单 -->
      <nav class="flex-1 flex flex-col gap-1 p-3 text-white/70">
        <a
          href="index.html"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-white/10 text-white font-bold transition"
          rel="noopener"
          >开始</a
        >
        <a
          href="#playlists"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 hover:text-white transition"
          >发现</a
        >
        <a
          href="#"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 hover:text-white transition"
          >我的喜欢</a
        >
      </nav>

      <!-- 底部用户 -->
      <div
        class="shrink-0 p-4 border-t border-white/10 flex items-center gap-3"
      >
        <img
          src="img/head.jpg"
          alt="用户头像"
          class="w-10 h-10 rounded-full object-cover shrink-0"
        />
        <p class="username text-white text-sm truncate">冴月麟</p>
      </div>
    </aside>

    <!-- ==================== 主内容区 ==================== -->
    <main class="md:ml-56 px-4 md:px-8 pt-6 pb-40 space-y-10">
      <!-- 搜索框 -->
      <div class="w-full mb-3 flex justify-center items-center">
        <input
          type="search"
          class="appearance-none px-4 py-2 w-full max-w-lg bg-white/10 rounded-2xl border-2 border-white/20 caret-indigo-500 outline-none focus:border-white-500 hover:bg-white/50 focus:bg-white/50"
        />
      </div>
      <!-- ============ 第一行：轮播图（待补充） ============ -->
      <section
        id="carousel"
        class="relative w-full h-44 md:h-56 rounded-2xl overflow-hidden bg-white/10 border border-white/10"
      >
        <!-- 轮播图内容待补充 -->
      </section>

      <!-- ============ 第二行：推荐歌曲（横向滑动） ============ -->
      <section>
        <div class="flex items-end justify-between mb-4">
          <div class="flex items-end gap-3">
            <h2 class="text-2xl text-white font-japan-cute">推荐歌曲</h2>
            <p class="text-sm text-white/50 font-japan-cute mb-1">今日好歌</p>
          </div>
          <!-- 左右切换按钮 -->
          <div class="flex items-center gap-2">
            <button
              id="songs-prev"
              type="button"
              aria-label="往前翻"
              class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition"
            >
              <img
                src="icon/caret-left-filled.png"
                alt=""
                class="w-4 h-4 object-contain"
              />
            </button>
            <button
              id="songs-next"
              type="button"
              aria-label="往后翻"
              class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition"
            >
              <img
                src="icon/caret-right-filled.png"
                alt=""
                class="w-4 h-4 object-contain"
              />
            </button>
          </div>
        </div>

        <div
          id="card-container"
          class="flex gap-4 overflow-x-auto scroll-smooth scrollbar-none pb-2"
        >
          <!-- 歌曲卡片由 js/index.js 动态渲染 -->
        </div>
      </section>

      <hr
        class="h-px border-0 bg-linear-to-r from-transparent via-white/30 to-transparent"
      />

      <!-- ============ 第三行：推荐歌单 ============ -->
      <section id="playlists" class="scroll-mt-24">
        <div class="flex items-end justify-between mb-4">
          <div class="flex items-end gap-3">
            <h2 class="text-2xl text-white font-japan-cute">推荐歌单</h2>
            <p class="text-sm text-white/50 font-japan-cute mb-1">
              根据你的喜好
            </p>
          </div>
          <!-- 左右切换按钮 -->
          <div class="flex items-center gap-2">
            <button
              id="playlists-prev"
              type="button"
              aria-label="往前翻"
              class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition"
            >
              <img
                src="icon/caret-left-filled.png"
                alt=""
                class="w-4 h-4 object-contain"
              />
            </button>
            <button
              id="playlists-next"
              type="button"
              aria-label="往后翻"
              class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition"
            >
              <img
                src="icon/caret-right-filled.png"
                alt=""
                class="w-4 h-4 object-contain"
              />
            </button>
          </div>
        </div>

        <div
          id="card-container-song"
          class="flex gap-4 overflow-x-auto scroll-smooth scrollbar-none pb-2"
        >
          <!-- 歌单卡片由 js/index.js 动态渲染 -->
        </div>
      </section>
    </main>

    <!-- ==================== 底部播放栏 ==================== -->
    <div
      class="bg-[#c4dae661] fixed bottom-0 left-0 md:left-56 right-0 h-20 flex rounded-t-lg items-center backdrop-blur-md mx-2 md:mx-4"
    >
      <!-- 专辑封面 -->
      <div class="flex items-center h-full ml-4 shrink-0">
        <img
          src="Album_Cover/63／64 Completion.jpg"
          class="Album_Cover w-16 h-16 rounded-full shadow-md animate-[spin_8s_linear_infinite] [animation-play-state:paused] object-cover"
          alt="专辑图片"
        />
      </div>

      <!-- 歌曲信息（点击打开大详情页） -->
      <div
        id="song-info"
        class="w-50 min-w-0 flex flex-col justify-center text-white ml-4 overflow-hidden relative cursor-pointer"
      >
        <p
          class="songName text-[white] font-japan-cute whitespace-nowrap block"
        >
          Fiesta de la Luna ～魔法少女達の百年祭
        </p>
        <p class="singerName text-sm text-[#373737] truncate font-japan-bit">
          ジャージと愉快な仲間たち
        </p>
      </div>

      <!-- 迷你歌词（点击打开大详情页） -->
      <div
        class="flex-1 min-w-0 flex flex-col justify-center gap-2 text-white/80 text-sm md:text-base text-center px-4"
      >
        <p
          class="mini-lyric lyric-text line-clamp-2 text-center w-full block cursor-pointer"
        >
          纯音乐，请欣赏
        </p>
        <!-- 翻译：固定显示在原文下方，没有翻译时隐藏 -->
        <p
          class="mini-lyric-trans hidden truncate text-center w-full text-[16px] leading-tight text-white/60"
        ></p>
      </div>

      <!-- 播放控制 -->
      <div class="flex items-center gap-4 ml-auto shrink-0 mr-2">
        <!-- 音量 -->
        <div class="relative flex items-center">
          <img
            id="volume-btn"
            src="icon/notice.png"
            class="w-6 h-6 object-contain cursor-pointer hover:scale-110 transition"
            alt="音量"
          />
          <div
            id="volume-panel"
            class="hidden absolute bottom-10 left-1/2 -translate-x-1/2 bg-black/60 p-3 rounded-lg backdrop-blur-md z-50"
          >
            <input
              id="volume-slider"
              type="range"
              min="0"
              max="1"
              step="0.05"
              value="1"
              class="w-24 accent-blue-500 cursor-pointer"
            />
          </div>
        </div>

        <img
          src="icon/caret-left-filled.png"
          class="w-7 h-7 object-contain cursor-pointer hover:scale-110 transition"
          alt="上一首"
        />
        <img
          src="icon/play.png"
          class="play_song w-10 h-10 object-contain cursor-pointer hover:scale-110 transition"
          alt="播放"
        />
        <img
          src="icon/pause.png"
          class="pause_song w-10 h-10 object-contain cursor-pointer hover:scale-110 transition hidden"
          alt="暂停"
        />
        <img
          src="icon/caret-right-filled.png"
          class="w-7 h-7 object-contain cursor-pointer hover:scale-110 transition"
          alt="下一首"
        />
      </div>
    </div>

    <!-- ==================== 大详情页（点歌名/歌词弹出） ==================== -->
    <div
      id="detail-page"
      class="hidden fixed inset-0 z-100 flex-col overflow-hidden"
    >
      <!-- 背景：当前专辑封面，模糊铺满 -->
      <div
        id="detail-bg"
        class="absolute inset-0 -z-20 bg-cover bg-center transition-all duration-700 bg-[#0f1a24]"
      ></div>
      <div
        class="absolute inset-0 -z-10 bg-[#0f1a24]/50 backdrop-blur-2xl"
      ></div>

      <!-- 左上角关闭 -->
      <div class="absolute top-4 left-4 z-50">
        <button id="detail-close" type="button" class="text-white text-2xl">
          <img
            src="icon/删除-无边框.png"
            alt="关闭"
            class="w-12 h-12 transition-transform duration-500 hover:rotate-180 hover:scale-110"
          />
        </button>
      </div>

      <!-- 详情页主体：左专辑 + 右歌词 -->
      <div
        class="flex flex-1 flex-col md:flex-row items-center md:justify-center gap-8 md:gap-12 px-4 md:px-20 py-20 md:py-0 overflow-y-auto w-full"
      >
        <!-- 专辑图 + 歌曲信息 + 播放控制 -->
        <div class="shrink-0 flex flex-col items-center mt-8 md:mt-0">
          <img
            src="Album_Cover/63／64 Completion.jpg"
            class="Album_Cover w-48 h-48 md:w-80 md:h-80 rounded-full shadow-2xl animate-[spin_8s_linear_infinite] [animation-play-state:paused] object-cover"
            alt="专辑图片"
          />

          <div
            class="w-full max-w-70 md:max-w-sm flex flex-col items-center justify-center text-center text-white mt-8 mb-4 px-4"
          >
            <div class="w-full overflow-hidden mb-2">
              <p
                class="songName text-2xl md:text-3xl font-bold font-japan-cute whitespace-nowrap block w-full truncate"
              >
                Fiesta de la Luna ～魔法少女達の百年祭
              </p>
            </div>
            <p
              class="singerName text-base md:text-lg text-white/60 truncate font-japan-bit w-full"
            >
              ジャージと愉快な仲間たち
            </p>
          </div>

          <div class="flex justify-center items-center gap-4 md:gap-6">
            <img
              src="icon/caret-left-filled.png"
              class="w-8 h-8 md:w-16 md:h-16 object-contain cursor-pointer hover:scale-110 transition"
              alt="上一首"
            />
            <img
              src="icon/play.png"
              class="play_song w-8 h-8 md:w-16 md:h-16 object-contain cursor-pointer hover:scale-110 transition"
              alt="播放"
            />
            <img
              src="icon/pause.png"
              class="pause_song w-8 h-8 md:w-16 md:h-16 object-contain cursor-pointer hover:scale-110 transition hidden"
              alt="暂停"
            />
            <img
              src="icon/caret-right-filled.png"
              class="w-8 h-8 md:w-16 md:h-16 object-contain cursor-pointer hover:scale-110 transition"
              alt="下一首"
            />
          </div>
        </div>

        <!-- 歌词 -->
        <div
          class="w-full md:w-1/2 flex flex-col items-center justify-center space-y-4 md:space-y-6 text-white px-4 py-4 md:py-20"
        >
          <p
            class="mini-lyric text-center w-full block cursor-pointer text-2xl md:text-[32px] font-japan-cute"
          >
            纯音乐，请欣赏
          </p>
          <p
            class="mini-lyric-trans hidden text-center w-full text-xl md:text-[26px] leading-tight text-white/80 font-japan-cute"
          ></p>
        </div>
      </div>

      <!-- 底部音频频谱：横跨整页，暂停时会平滑落下去 -->
      <div
        class="relative z-10 w-full shrink-0 px-6 md:px-16 pb-4 md:pb-6 pointer-events-none"
      >
        <canvas
          id="visualizer"
          width="1200"
          height="96"
          class="w-full h-14 md:h-20 opacity-80"
        ></canvas>
      </div>
    </div>

    <!-- 隐藏的音频播放器 -->
    <audio
      id="my-audio"
      src="audio/ジャージと愉快な仲間たち - Fiesta de la Luna ～魔法少女達の百年祭.mp3"
    ></audio>

    <!-- ==================== 脚本 ==================== -->
    <script src="./js/jquery-4.0.0.min.js"></script>
    <!-- data.js：歌曲 / 歌单数据（加歌、改歌单只动这里） -->
    <script src="./js/data.js"></script>
    <!-- ui.js：用户名、歌名滚动、大详情页、横向翻页 -->
    <script src="./js/ui.js"></script>
    <!-- player.js：播放 / 暂停、歌词、频谱、音量 -->
    <script src="./js/player.js"></script>
    <!-- cards.js：推荐歌曲 / 推荐歌单卡片 -->
    <script src="./js/cards.js"></script>
  </body>
</html>
