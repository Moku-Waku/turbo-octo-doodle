<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音乐播放页</title>
    <!-- 标签栏图标 -->
    <link rel="icon" href="./icon/reisa.ico" type="image/png" />
    <link href="./tailwind_package/src/output.css" rel="stylesheet" />
  </head>
  <body>
    <!-- 背景图 -->
    <div
      class="fixed inset-0 -z-10 bg-cover bg-center bg-no-repeat blur-[2px]"
      style="background-image: url(&quot;img/Touhou-.webp&quot;)"
    ></div>

    <!-- 导航栏 -->
    <div
      class="w-full max-w-full h-16 rounded-b-lg opacity-75 bg-[#dbe8f644] font-japan-cute flex items-center relative"
    >
      <button
        id="sidebar-btn"
        type="button"
        aria-label="打开侧边栏"
        class="group absolute left-4 top-1/2 -translate-y-1/2 w-8 h-8"
      >
        <img
          src="icon/可拖拽.png"
          alt="侧边栏"
          class="absolute inset-0 w-8 h-8 object-contain transition-opacity duration-200 group-hover:opacity-0"
        />
        <img
          src="icon/可拖拽_选中.png"
          alt=""
          class="absolute inset-0 w-8 h-8 object-contain opacity-0 transition-opacity duration-200 group-hover:opacity-100"
        />
      </button>
      <ul class="flex w-full gap-6 list-none justify-center text-3xl">
        <li>
          <a href="index.html" class="text-white hover:text-blue-300 transition"
            >开始</a
          >
        </li>
        <li>
          <a
            href="Playlist_page/songlist.html"
            class="text-white hover:text-blue-300 transition"
            >歌单</a
          >
        </li>
        <li>
          <a href="#" class="text-white hover:text-blue-300 transition"
            >我的喜欢</a
          >
        </li>
      </ul>
    </div>

     <!-- ================= 左右分栏大容器 ================= -->
    <div class="flex h-full w-full">
      <!-- 左侧侧边栏（默认隐藏，点按钮从左边滑出） -->
       <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-[#dbe8f644] flex flex-col backdrop-blur-md border-r border-white/20 z-40 -translate-x-full transition-transform duration-300">
        <div class="h-16 flex items-center justify-center text-white text-2xl font-japan-cute border-b border-white/20 relative">
          <div class="flex items-center justify-between gap-1">
          <img src="img/head.jpg" class="rounded-full w-12 h-12 object-cover " alt="用户头像">
          <p id="username">冴月麟</p>
          </div>

          <button
            id="sidebar-close"
            type="button"
            aria-label="关闭侧边栏"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-white text-xl leading-none hover:text-blue-300 transition"
          >
            ✕
          </button>
        </div>
        
        <!-- 垂直菜单 (flex-col) -->
        <nav class="flex-1 flex flex-col gap-2 p-4 text-white">
          <a href="index.html" class="px-4 py-3 rounded-lg bg-white/20 font-bold hover:bg-white/30 transition">开始</a>
          <a href="Playlist_page/songlist.html" class="px-4 py-3 rounded-lg hover:bg-white/20 transition">歌单</a>
          <a href="#" class="px-4 py-3 rounded-lg hover:bg-white/20 transition">我的喜欢</a>
        </nav>
      </aside>
      <!-- 遮罩：点一下关闭侧边栏 -->
      <div id="sidebar-mask" class="fixed inset-0 bg-black/40 z-30 hidden"></div>
      <!-- 主体部分（滚动的容器） -->
      <div
        class="bg-[#dbe8f644] w-[80vw] h-[calc(100vh-11rem)] mx-auto mt-4 rounded-md overflow-y-auto p-4 scrollbar-none"
      >
        <!--  网格布局，自适应一行放几个  -->
        <!-- 手机2列，平板3列，中等屏幕4列，大屏幕5列，gap-4控制卡片间距 -->
          <div
            id="card-container"
            class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 justify-items-center"
          >
            <!-- 里面的卡片用 jQuery 动态塞进来 -->
          </div>
      </div>
    </div>
    <!-- 播放栏 -->
    <div
      class="bg-[#c4dae661] w-[90%] h-20 fixed bottom-0 inset-x-0 flex rounded-t-lg items-center backdrop-blur-md mx-auto"
    >
      <!-- 播放栏左侧音乐文件详情 -->
      <div class="flex items-center h-full ml-4 flex-shrink-0">
        <img
          id="Album_Cover"
          src="Album_Cover/63／64 Completion.jpg"
          class="w-16 h-16 rounded-full shadow-md animate-[spin_8s_linear_infinite] [animation-play-state:paused] object-cover"
          alt="专辑图片"
        />
      </div>
      <!-- 歌曲信息 -->
      <div
        class="max-w-[30%] min-w-0 flex flex-col justify-center text-white ml-4"
      >
        <p  id="songName" class="text-[white] truncate font-japan-cute">
          Fiesta de la Luna ～魔法少女達の百年祭
        </p>
        <p id="singerName" class="text-sm text-[#787676dd] truncate font-japan-bit">
          ジャージと愉快な仲間たち
        </p>
      </div>
      <!-- 小型歌词显示 -->
      <div
        class="flex-1 min-w-0 flex flex-col justify-center text-white/80 text-sm md:text-base text-center px-4"
      >
        <p id="mini-lyric" class="lyric-text truncate text-center">纯音乐，请欣赏</p>
      </div>
      <!-- 播放按钮组件 -->
      <div class="flex items-center gap-4 ml-auto flex-shrink-0 mr-2">
                <!-- 音量控制组件 -->
        <div class="relative flex items-center">
            <img
              id="volume-btn"
              src="icon/notice.png"
              class="w-6 h-6 object-contain cursor-pointer hover:scale-110 transition"
              alt="音量"
            />
            <!-- 弹出的滑动条，默认隐藏 -->
            <div id="volume-panel" class="hidden absolute bottom-10 left-1/2 -translate-x-1/2 bg-black/60 p-3 rounded-lg backdrop-blur-md z-50">
                <input 
                  id="volume-slider" 
                  type="range" 
                  min="0" 
                  max="1" 
                  step="0.05" 
                  value="1"
                  class="w-24 accent-blue-500 cursor-pointer"
                >
            </div>
        </div>
        <img
          src="icon/caret-left-filled.png"
          class="w-7 h-7 object-contain cursor-pointer hover:scale-110 transition"
          alt="上一首"
        />
        <img
          id="play_song"
          src="icon/play.png"
          class="w-10 h-10 object-contain cursor-pointer hover:scale-110 transition"
          alt="播放"
        />
        <img
          id="pause_song"
          src="icon/pause.png"
          class="w-10 h-10 object-contain cursor-pointer hover:scale-110 transition hidden"
          alt="暂停"
        />
        <img
          src="icon/caret-right-filled.png"
          class="w-7 h-7 object-contain cursor-pointer hover:scale-110 transition"
          alt="下一首"
        />

      </div>
    </div>
    <!-- 隐藏的音频播放器，放在 <body> 结束标签前 -->
    <audio id="my-audio" src="audio/ジャージと愉快な仲間たち - Fiesta de la Luna ～魔法少女達の百年祭.mp3"></audio>
    <!-- 引用文件 -->
    <script src="./js/jquery-4.0.0.min.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
