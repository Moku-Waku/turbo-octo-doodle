<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音乐播放页</title>
    <!-- 标签栏图标 -->
    <link rel="icon" href="./icon/reisa.ico" type="image/png" />
    <link href="./tailwind_package/src/output.css" rel="stylesheet" />
  </head>
  <body>
    <!-- 背景图 -->
    <div
      class="fixed inset-0 -z-10 bg-cover bg-center bg-no-repeat blur-[2px]"
      style="background-image: url(&quot;img/Touhou-.webp&quot;)"
    ></div>

    <!-- 导航栏 -->
    <div
      class="w-full max-w-full h-16 rounded-b-lg bg-[#dbe8f644] font-japan-cute flex items-center relative"
    >
      <button
        id="sidebar-btn"
        type="button"
        aria-label="打开侧边栏"
        class="group absolute left-4 top-1/2 -translate-y-1/2 w-8 h-8"
      >
        <img
          src="icon/可拖拽.png"
          alt="侧边栏"
          class="absolute inset-0 w-8 h-8 object-contain transition-opacity duration-200 group-hover:opacity-0"
        />
        <img
          src="icon/可拖拽_选中.png"
          alt=""
          class="absolute inset-0 w-8 h-8 object-contain opacity-0 transition-opacity duration-200 group-hover:opacity-100"
        />
      </button>
      <ul class="flex w-full gap-6 list-none justify-center text-3xl">
        <li>
          <a
            href="index.html"
            class="text-white hover:text-blue-300 transition"
            rel="noopener"
            >开始</a
          >
        </li>
        <li>
          <a
            href="other_pages/songlist.html"
            class="text-white hover:text-blue-300 transition"
            target="_blank"
            rel="noopener"
            >发现</a
          >
        </li>
        <li>
          <a href="#" class="text-white hover:text-blue-300 transition"
            >我的喜欢</a
          >
        </li>
      </ul>
      <!-- 导航栏右侧用户信息 -->
      <div
        class="absolute right-4 top-1/2 -translate-y-1/2 hidden md:flex items-center gap-3"
      >
        <img
          src="img/head.jpg"
          class="rounded-full w-12 h-12 object-cover shrink-0"
          style="width: 48px; height: 48px"
          alt="用户头像"
        />
        <p class="text-white username">冴月麟</p>
      </div>
    </div>

    <!-- ================= 左右分栏大容器 ================= -->
    <div class="flex h-full w-full">
      <!-- 左侧侧边栏（默认隐藏，点按钮从左边滑出） -->
      <aside
        id="sidebar"
        class="fixed top-0 left-0 h-full w-64 overflow-hidden bg-[#dbe8f644] flex flex-col backdrop-blur-md border-r border-white/20 z-40 -translate-x-full transition-transform duration-300"
      >
        <div
          class="h-16 flex items-center justify-center text-white text-2xl font-japan-cute border-b border-white/20 relative"
        >
          <div class="flex items-center justify-between gap-3">
            <img
              src="img/head.jpg"
              class="rounded-full w-12 h-12 object-cover shrink-0"
              style="width: 48px; height: 48px"
              alt="用户头像"
            />
            <p class="username">冴月麟</p>
          </div>

          <button
            id="sidebar-close"
            type="button"
            aria-label="关闭侧边栏"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-white text-xl leading-none hover:text-blue-300 transition"
          >
            ✕
          </button>
        </div>

        <!-- 垂直菜单 (flex-col) -->
        <nav class="flex-1 flex flex-col gap-2 p-4 text-white">
          <a
            href="index.html"
            class="px-4 py-3 rounded-lg bg-white/20 font-bold hover:bg-white/30 transition"
            rel="noopener"
            >开始</a
          >
          <a
            href="other_pages/songlist.html"
            class="px-4 py-3 rounded-lg hover:bg-white/20 transition"
            target="_blank"
            rel="noopener"
            >发现</a
          >
          <a href="#" class="px-4 py-3 rounded-lg hover:bg-white/20 transition"
            >我的喜欢</a
          >
        </nav>
      </aside>
      <!-- 遮罩：点一下关闭侧边栏 -->
      <div
        id="sidebar-mask"
        class="fixed inset-0 bg-black/40 z-30 hidden"
      ></div>
      <!-- 主体部分（滚动的容器） -->
      <div
        class="bg-[#dbe8f644] w-[90vw] h-[calc(100vh-11rem)] mx-auto mt-4 rounded-md overflow-y-auto p-4 scrollbar-none"
      >
        <!--  网格布局，自适应一行放几个  -->
        <!-- 手机2列，平板3列，中等屏幕4列，大屏幕5列，gap-4控制卡片间距 -->
        <div class="flex items-end">
          <p class="text-2xl text-white font-japan-cute">推荐歌曲</p>
          <p class="text-sm text-white/50 font-japan-cute">今日好歌</p>
        </div>
        <hr
          class="h-px border-0 bg-linear-to-r from-transparent via-white/50 to-transparent my-2"
        />
        <div
          id="card-container"
          class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 justify-items-center"
        >
          <!-- 里面的卡片用 jQuery 动态塞进来 -->
        </div>
      </div>
    </div>
    <!-- 播放栏 -->
    <div
      class="bg-[#c4dae661] w-[90%] h-20 fixed bottom-0 inset-x-0 flex rounded-t-lg items-center backdrop-blur-md mx-auto"
    >
      <!-- 播放栏左侧音乐文件详情 -->
      <div class="flex items-center h-full ml-4 shrink-0">
        <img
          src="Album_Cover/63／64 Completion.jpg"
          class="Album_Cover w-16 h-16 rounded-full shadow-md animate-[spin_8s_linear_infinite] [animation-play-state:paused] object-cover"
          alt="专辑图片"
        />
      </div>
      <!-- 歌曲信息 -->
      <div
        id="song-info"
        class="w-50 min-w-0 flex flex-col justify-center text-white ml-4 overflow-hidden relative cursor-pointer"
      >
        <p
          class="songName text-[white] font-japan-cute whitespace-nowrap block"
        >
          Fiesta de la Luna ～魔法少女達の百年祭
        </p>
        <p class="singerName text-sm text-[#373737] truncate font-japan-bit">
          ジャージと愉快な仲間たち
        </p>
      </div>
      <!-- 小型歌词显示 -->
      <div
        class="flex-1 min-w-0 flex flex-col justify-center gap-2 text-white/80 text-sm md:text-base text-center px-4"
      >
        <p
          class="mini-lyric lyric-text line-clamp-2 text-center w-full block cursor-pointer"
        >
          纯音乐，请欣赏
        </p>
        <!-- 翻译：固定显示在原文下方，没有翻译时隐藏 -->
        <p
          class="mini-lyric-trans hidden truncate text-center w-full text-[16px] leading-tight text-white/60"
        ></p>
      </div>
      <!-- 播放按钮组件 -->
      <div class="flex items-center gap-4 ml-auto shrink-0 mr-2">
        <!-- 音量控制组件 -->
        <div class="relative flex items-center">
          <img
            id="volume-btn"
            src="icon/notice.png"
            class="w-6 h-6 object-contain cursor-pointer hover:scale-110 transition"
            alt="音量"
          />
          <!-- 弹出的滑动条，默认隐藏 -->
          <div
            id="volume-panel"
            class="hidden absolute bottom-10 left-1/2 -translate-x-1/2 bg-black/60 p-3 rounded-lg backdrop-blur-md z-50"
          >
            <input
              id="volume-slider"
              type="range"
              min="0"
              max="1"
              step="0.05"
              value="1"
              class="w-24 accent-blue-500 cursor-pointer"
            />
          </div>
        </div>
        <img
          src="icon/caret-left-filled.png"
          class="w-7 h-7 object-contain cursor-pointer hover:scale-110 transition"
          alt="上一首"
        />
        <img
          src="icon/play.png"
          class="play_song w-10 h-10 object-contain cursor-pointer hover:scale-110 transition"
          alt="播放"
        />
        <img
          src="icon/pause.png"
          class="pause_song w-10 h-10 object-contain cursor-pointer hover:scale-110 transition hidden"
          alt="暂停"
        />
        <img
          src="icon/caret-right-filled.png"
          class="w-7 h-7 object-contain cursor-pointer hover:scale-110 transition"
          alt="下一首"
        />
      </div>
    </div>
    <!-- ====================点击专辑或者歌手名和信息弹出大歌曲详情======================================= -->
    <div
      id="detail-page"
      class="hidden fixed inset-0 z-100 flex-col overflow-hidden"
    >
      <!-- =============================背景图是专辑图============================ -->
      <div
        id="detail-bg"
        class="absolute inset-0 -z-20 bg-cover bg-center transition-all duration-700 bg-[#0f1a24]"
      ></div>
      <!-- 中层 -->
      <div
        class="absolute inset-0 -z-10 bg-[#0f1a24]/50 backdrop-blur-2xl"
      ></div>
      <!-- 顶部关闭按钮 -->
      <div class="flex items-center p-4 shrink-0">
        <button id="detail-close" type="button" class="text-white text-2xl">
          <img
            src="icon/删除-无边框.png"
            alt="关闭"
            class="w-12 h-12 transition-transform duration-500 hover:rotate-180 hover:scale-110"
          />
        </button>
      </div>
      <!-- -------------------主体区----------------------------- -->
      <div
        class="flex flex-1 flex-col md:flex-row items-center justify-center gap-8 md:gap-12 px-4 md:px-8 pb-10 overflow-y-auto w-full"
      >
        <!-- -------------------详情页专辑图----------------------------- -->
        <div class="shrink-0 flex flex-col items-center mt-8 md:mt-0">
          <img
            src="Album_Cover/63／64 Completion.jpg"
            class="Album_Cover w-48 h-48 md:w-80 md:h-80 rounded-full shadow-2xl animate-[spin_8s_linear_infinite] [animation-play-state:paused] object-cover"
            alt="专辑图片"
          />
          <div
            class="w-full max-w-70 md:max-w-sm flex flex-col items-center justify-center text-center text-white mt-8 mb-4 px-4"
          >
            <div class="w-full overflow-hidden mb-2">
              <p
                class="songName text-2xl md:text-3xl font-bold font-japan-cute whitespace-nowrap block w-full truncate"
              >
                Fiesta de la Luna ～魔法少女達の百年祭
              </p>
            </div>
            <p
              class="singerName text-base md:text-lg text-white/60 truncate font-japan-bit w-full"
            >
              ジャージと愉快な仲間たち
            </p>
          </div>
          <div class="flex justify-center items-center gap-4 md:gap-6">
            <img
              src="icon/caret-left-filled.png"
              class="w-8 h-8 md:w-16 md:h-16 object-contain cursor-pointer hover:scale-110 transition"
              alt="上一首"
            />
            <img
              src="icon/play.png"
              class="play_song w-8 h-8 md:w-16 md:h-16 object-contain cursor-pointer hover:scale-110 transition"
              alt="播放"
            />
            <img
              src="icon/pause.png"
              class="pause_song w-8 h-8 md:w-16 md:h-16 object-contain cursor-pointer hover:scale-110 transition hidden"
              alt="暂停"
            />
            <img
              src="icon/caret-right-filled.png"
              class="w-8 h-8 md:w-16 md:h-16 object-contain cursor-pointer hover:scale-110 transition"
              alt="下一首"
            />
          </div>
        </div>
        <!-- -------------------歌词----------------------------- -->
        <div
          class="flex-1 flex flex-col w-full min-h-0 overflow-y-auto space-y-4 md:space-y-6 text-white/80 scrollbar-none py-10 md:py-20 items-center"
        >
          <p
            class="mini-lyric lyric-text text-center w-full block cursor-pointer text-2xl md:text-[32px] font-japan-cute"
          >
            纯音乐，请欣赏
          </p>
          <!-- 翻译 -->
          <p
            class="mini-lyric-trans hidden text-center w-full text-xl md:text-[28px] leading-tight text-white/80 font-japan-cute"
          ></p>
        </div>
      </div>
    </div>

    <!-- 隐藏的音频播放器，放在 <body> 结束标签前 -->
    <audio
      id="my-audio"
      src="audio/ジャージと愉快な仲間たち - Fiesta de la Luna ～魔法少女達の百年祭.mp3"
    ></audio>
    <!-- 引用文件 -->
    <script src="./js/jquery-4.0.0.min.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
